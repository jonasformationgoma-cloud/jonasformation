<style data-keep="">
:root{--blue:#1d4ed8;--navy:#0f1f4d;--yellow:#facc15;--red:#dc2626;--green:#16a34a;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{background:#fff;color:var(--navy);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.slot{position:relative;background-size:cover;background-position:center;overflow:hidden}
.slot .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:3.5rem}
.slot .chg{display:none;position:absolute;inset:0;background:rgba(15,31,77,.6);color:#fff;font-weight:600;align-items:center;justify-content:center;cursor:pointer;text-align:center;padding:8px;z-index:2}
body.edit .slot .chg{display:flex}
body.edit [data-k]{outline:2px dashed var(--green);outline-offset:3px;cursor:text}
.card{transition:transform .3s,box-shadow .3s}
.card:hover{transform:translateY(-8px);box-shadow:0 22px 40px -14px rgba(15,31,77,.35)}
.rv{opacity:0;transform:translateY(24px);transition:all .7s}
.rv.in{opacity:1;transform:none}
.confbg{background-image:linear-gradient(90deg,#1d4ed8,#dc2626,#facc15,#16a34a)}
.stripe{height:5px;background:linear-gradient(90deg,var(--blue) 25%,var(--yellow) 25% 50%,var(--red) 50% 75%,var(--green) 75%)}
input{background:#fff;color:var(--navy)}
</style>

}

function wire() {
 const mm = document.getElementById("mm");
 document.getElementById("burger").onclick = () => mm.classList.toggle("hidden");
 mm.querySelectorAll("a").forEach(a => a.onclick = () => mm.classList.add("hidden"));
 document.getElementById("reg").addEventListener("submit", e => {
  e.preventDefault();
  const n = document.getElementById("nom").value.trim(), t = document.getElementById("tel").value.trim();
  document.getElementById("okwa").href = WA() + "?text=" + encodeURIComponent(`Bonjour Jonas, je suis ${n} (WhatsApp : ${t}). Je m'inscris à la conférence de Goma.`);
  e.target.classList.add("hidden"); document.getElementById("ok").classList.remove("hidden");
 });
 const io = new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting) { x.target.classList.add("in"); io.unobserve(x.target); } }), { threshold: .12 });
 document.querySelectorAll(".rv").forEach(el => io.observe(el));
}

function shrink(file) {
 return new Promise(res => { const r = new FileReader(); r.onload = () => { const im = new Image(); im.onload = () => {
  const k = Math.min(1, 900 / Math.max(im.width, im.height)), c = document.createElement("canvas");
  c.width = im.width * k; c.height = im.height * k; c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
  res(c.toDataURL("image/jpeg", .78)); }; im.src = r.result; }; r.readAsDataURL(file); });
}
document.addEventListener("change", async e => {
 if (!document.body.classList.contains("edit") || !e.target.matches(".slot input")) return;
 const f = e.target.files[0]; if (!f) return;
 const slot = e.target.closest(".slot"), url = await shrink(f);
 ST.img[slot.dataset.img] = url; slot.style.backgroundImage = `url(${url})`;
 const ph = slot.querySelector(".ph"); if (ph) ph.style.display = "none";
});
document.addEventListener("click", e => { if (document.body.classList.contains("edit") && e.target.closest("a")) e.preventDefault(); });

async function publish() {
 document.querySelectorAll("[data-k]").forEach(el => ST.t[el.dataset.k] = el.textContent);
 const c = document.documentElement.cloneNode(true);
 c.querySelector("#app").innerHTML = ""; c.querySelector("#bar").innerHTML = ""; c.querySelector("body").removeAttribute("class");
 c.querySelectorAll("style:not([data-keep])").forEach(s => s.remove());
 c.querySelector("#state").textContent = JSON.stringify(ST).replace(/</g, "\\u003c");
 const html = "<!DOCTYPE html>\n" + c.outerHTML;
 try { const a = await claude.use("artifact"); if (!a) throw 0; await a.publish(html); }
 catch (err) { alert("Enregistrement impossible. Vérifiez que vous êtes connecté à votre compte Claude."); }
}

function bar(owner) {
 const b = document.getElementById("bar"); let editing = false;
 b.innerHTML = `<div id="tl" class="hidden flex-col items-end gap-2"><button id="lk" class="bg-white border border-slate-300 shadow px-4 py-2 rounded-full text-sm font-semibold">🔗 Contacts & liens</button><button id="sv" class="text-white shadow px-4 py-2 rounded-full text-sm font-bold" style="background:var(--green)">💾 Enregistrer pour tous</button></div><button id="ed" class="text-white shadow-xl px-5 py-3 rounded-full font-bold" style="background:var(--blue)">✏️ Modifier</button>`;
 b.querySelector("#ed").onclick = () => {
  editing = !editing; document.body.classList.toggle("edit", editing);
  document.querySelectorAll("[data-k]").forEach(el => el.contentEditable = editing);
  b.querySelector("#tl").style.display = editing ? "flex" : "none";
  b.querySelector("#ed").textContent = editing ? "✖ Quitter" : "✏️ Modifier";
 };
 b.querySelector("#lk").onclick = () => {
  for (const [k, q] of [["phone", "Numéro WhatsApp / téléphone"], ["grp", "Lien du groupe WhatsApp (https://chat.whatsapp.com/...)"], ["m1", "Email 1"], ["m2", "Email 2"], ["tt", "Lien TikTok (https://www.tiktok.com/@...)"]]) {
   const v = prompt(q, L(k)); if (v) ST.links[k] = v.trim();
  }
  document.querySelectorAll("[data-k]").forEach(el => ST.t[el.dataset.k] = el.textContent);
  render(); document.body.classList.add("edit");
  document.querySelectorAll("[data-k]").forEach(el => el.contentEditable = true);
 };
 b.querySelector("#sv").onclick = publish;
}

render();
(async () => {
 try { if (!window.claude) return; const u = await claude.use("user");  } catch (e) {}
})();
</script>
